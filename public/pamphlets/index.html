<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sociva Print Pamphlets</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0d0d0d;
      color: #f0f0f0;
      font-family: system-ui, sans-serif;
    }
    .box {
      width: min(420px, 92vw);
      background: #1f1c1b;
      border: 1px solid #292929;
      border-radius: 16px;
      padding: 28px;
    }
    h1 {
      margin: 0 0 6px;
      font-size: 22px;
      background: linear-gradient(135deg, #f0f0f0, #27c17a);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    p { color: #8a8a8a; font-size: 14px; line-height: 1.5; margin: 0 0 18px; }
    a {
      display: block;
      text-decoration: none;
      background: #27c17a;
      color: #04140c;
      font-weight: 700;
      text-align: center;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 10px;
    }
    a.secondary {
      background: transparent;
      color: #eee;
      border: 1px solid #444;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>SOCIVA pamphlets</h1>
    <p>Print-ready A4 and A5 using Sociva dark charcoal + green brand tokens. QR points to https://www.sociva.in/</p>
    <a href="./a4.html">Open A4 (210×297mm)</a>
    <a class="secondary" href="./a5.html">Open A5 (148×210mm)</a>
  </div>
</body>
</html>
