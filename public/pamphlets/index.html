<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sociva Print Pamphlets</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0B1010;
      color: #FDFCFA;
      font-family: "Plus Jakarta Sans", system-ui, sans-serif;
    }
    .box {
      width: min(440px, 92vw);
      background: #141416;
      border: 1px solid #2a2a2e;
      border-radius: 16px;
      padding: 28px;
    }
    h1 {
      margin: 0 0 6px;
      font-size: 22px;
      background: linear-gradient(135deg, #FDFCFA, #22A06B);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    p { color: #8a8a8a; font-size: 14px; line-height: 1.5; margin: 0 0 18px; }
    a {
      display: block;
      text-decoration: none;
      background: #22A06B;
      color: #04140c;
      font-weight: 700;
      text-align: center;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 10px;
    }
    a.secondary {
      background: transparent;
      color: #eee;
      border: 1px solid #444;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>SOCIVA pamphlets</h1>
    <p>Open these via file link or local server. Images use relative paths so they work offline.</p>
    <a href="./trifold.html">Open Trifold (A4 landscape)</a>
    <a class="secondary" href="./a4.html">Open A4 portrait (210×297mm)</a>
    <a class="secondary" href="./a5.html">Open A5 portrait (148×210mm)</a>
  </div>
</body>
</html>
