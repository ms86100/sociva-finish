<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Update Sociva</title>
  <meta name="description" content="Update the Sociva app from the App Store or Google Play." />
  <link rel="canonical" href="https://sociva.in/update" />
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: #0b0f14; color: #e8eef5; }
    main { max-width: 28rem; margin: 0 auto; padding: 3rem 1.25rem; text-align: center; }
    h1 { font-size: 1.6rem; margin: 0 0 0.75rem; }
    p { color: #b7c2ce; line-height: 1.5; margin: 0; }
    .stores { display: flex; flex-direction: column; gap: 0.75rem; margin-top: 1.5rem; }
    a { display: block; text-decoration: none; font-weight: 700; border-radius: 999px; padding: 0.85rem 1.4rem; }
    a.primary { background: #fff; color: #0b0f14; }
    a.secondary { background: transparent; color: #e8eef5; border: 1px solid #3a4553; }
  </style>
</head>
<body>
  <main>
    <h1>A better Sociva is ready</h1>
    <p>Clearer store menus, smoother checkout, and delivery you can confirm. Update to see food, services, and stores in your society.</p>
    <div class="stores" id="stores">
      <a id="ios" class="primary" href="https://apps.apple.com/in/app/sociva/id6759218504">Update on the App Store</a>
      <a id="android" class="secondary" href="https://play.google.com/store/apps/details?id=app.sociva.community&amp;hl=en_IN">Update on Google Play</a>
    </div>
  </main>
  <script>
    (function () {
      var android = /android/i.test(navigator.userAgent || '');
      if (!android) return;
      var play = document.getElementById('android');
      var apple = document.getElementById('ios');
      var stores = document.getElementById('stores');
      if (!play || !apple || !stores) return;
      play.className = 'primary';
      apple.className = 'secondary';
      stores.insertBefore(play, apple);
    })();
  </script>
</body>
</html>
