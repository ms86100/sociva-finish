<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <!-- Mobile App Configuration -->

    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Sociva" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#1a1a2e" />
    <meta name="msapplication-TileColor" content="#1a1a2e" />

    <!-- Open Graph / Social -->
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://storage.googleapis.com/gpt-engineer-file-uploads/BIGOZ5GNb4QR5gjdzagHKwPFZlp2/social-images/social-1775487812450-steamy-chicken-momos-with-black-background-and-ser-upscaled.webp">
    <meta property="og:site_name" content="Sociva" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://storage.googleapis.com/gpt-engineer-file-uploads/BIGOZ5GNb4QR5gjdzagHKwPFZlp2/social-images/social-1775487812450-steamy-chicken-momos-with-black-background-and-ser-upscaled.webp">

    <!-- App Icons -->
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Instant first paint while JS downloads - do NOT preload unused media -->
    <style>
      html, body { margin: 0; background: #1a1a2e; }
      #boot-splash {
        position: fixed; inset: 0; z-index: 2147483646;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: #0a0a0f; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        pointer-events: none;
      }
      #boot-splash h1 {
        margin: 0; font-size: 2.75rem; font-weight: 900; letter-spacing: 0.2em;
        background: linear-gradient(135deg, #fff 0%, #34d399 100%);
        -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
      }
      #boot-splash p {
        margin: 1rem 0 0; font-size: 11px; font-weight: 500; letter-spacing: 0.35em;
        text-transform: uppercase; color: #6b9b82;
      }
      #boot-splash .dots { display: flex; gap: 6px; margin-top: 2.5rem; }
      #boot-splash .dots span {
        width: 6px; height: 6px; border-radius: 50%; background: #4a8f6d; opacity: 0.35;
        animation: boot-pulse 1.2s ease-in-out infinite;
      }
      #boot-splash .dots span:nth-child(2) { animation-delay: 0.2s; }
      #boot-splash .dots span:nth-child(3) { animation-delay: 0.4s; }
      @keyframes boot-pulse {
        0%, 100% { opacity: 0.3; transform: scale(0.85); }
        50% { opacity: 1; transform: scale(1.15); }
      }
      #root[data-app-mounted] ~ #boot-splash,
      #root[data-app-mounted] #boot-splash { display: none !important; }
    </style>

  
  
  
  <meta property="og:title" content="Sociva - Community Marketplace">
  <meta name="twitter:title" content="Sociva - Community Marketplace">
  <meta property="og:description" content="Your society&#39;s private marketplace. Buy, sell, and connect with verified neighbors - food, services, rentals, and more.">
  <meta name="twitter:description" content="Your society&#39;s private marketplace. Buy, sell, and connect with verified neighbors - food, services, rentals, and more.">
  <script>
    (function () {
      try {
        var cap = window.Capacitor;
        if (cap && typeof cap.isNativePlatform === 'function' && cap.isNativePlatform()) return;
        var raw = (location.hash || '').replace(/^#/, '') || '/';
        var path = raw.split('?')[0] || '/';
        if (path === '/landing') return;
        var exact = { '/': 1, '/search': 1, '/categories': 1, '/discover-location': 1, '/cart': 1 };
        var blocked = !!exact[path]
          || path.indexOf('/category/') === 0
          || path.indexOf('/discovery/') === 0
          || path.indexOf('/product/') === 0
          || path.indexOf('/festival-collection/') === 0;
        var seller = path.match(/^\/seller\/([^/]+)\/?$/);
        if (seller) {
          var appPages = { products: 1, settings: 1, dashboard: 1, orders: 1, credits: 1, wallet: 1, payouts: 1, analytics: 1, onboarding: 1, become: 1, delivery: 1, notifications: 1, support: 1, reviews: 1, store: 1, stores: 1, messages: 1, earnings: 1, coupons: 1, 'category-requests': 1 };
          if (!appPages[seller[1]]) blocked = true;
        }
        if (!blocked) return;
        location.replace(location.pathname + location.search + '#/landing');
      } catch (e) {}
    })();
  </script>
</head>

  <body style="background-color: #1a1a2e">
    <div id="root">
      <div id="boot-splash" aria-busy="true" aria-live="polite">
        <h1>SOCIVA</h1>
        <p>Your Society, Your Store</p>
        <div class="dots" aria-hidden="true"><span></span><span></span><span></span></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
