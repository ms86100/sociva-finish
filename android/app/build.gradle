apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

// Transistorsoft Background Geolocation — license key for applicationId app.sociva.community
// Purchase / generate at https://www.transistorsoft.com/shop/customers then put in
// android/transistorsoft.properties (gitignored) or set TRANSISTORSOFT_LICENSE in CI.
def resolveTransistorsoftLicense = {
    def fromEnv = System.getenv('TRANSISTORSOFT_LICENSE') ?: System.getenv('BGGEO_LICENSE')
    if (fromEnv) {
        def trimmed = fromEnv.trim()
        if (trimmed && trimmed != 'YOUR_TRANSISTORSOFT_LICENSE_KEY_HERE') return trimmed
    }
    def propsFile = rootProject.file('transistorsoft.properties')
    if (propsFile.exists()) {
        def props = new Properties()
        props.load(new FileInputStream(propsFile))
        def key = props.getProperty('license') ?: props.getProperty('transistorsoftLicense')
        if (key) {
            def trimmed = key.trim()
            if (trimmed && trimmed != 'YOUR_TRANSISTORSOFT_LICENSE_KEY_HERE') return trimmed
        }
    }
    return ''
}
def transistorsoftLicense = resolveTransistorsoftLicense()
def hasTransistorsoftLicense = !transistorsoftLicense.isEmpty()
if (hasTransistorsoftLicense) {
    logger.lifecycle("Transistorsoft license: PRESENT (Background Geolocation enabled for Android)")
} else {
    logger.warn("Transistorsoft license: MISSING — Android release builds will use Capacitor Geolocation fallback. Set TRANSISTORSOFT_LICENSE or android/transistorsoft.properties.")
}

android {
    namespace = "app.sociva.community"
    compileSdk = rootProject.ext.compileSdkVersion
    buildFeatures {
        buildConfig = true
    }
    defaultConfig {
        applicationId "app.sociva.community"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 38
        versionName "2.0.38"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        manifestPlaceholders = [transistorsoftLicense: transistorsoftLicense]
        buildConfigField "boolean", "HAS_TRANSISTORSOFT_LICENSE", hasTransistorsoftLicense ? "true" : "false"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            // Optional local signing: copy android/keystore.properties.example → android/keystore.properties
            def keystorePropsFile = rootProject.file('keystore.properties')
            if (keystorePropsFile.exists()) {
                def keystoreProps = new Properties()
                keystoreProps.load(new FileInputStream(keystorePropsFile))
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            def keystorePropsFile = rootProject.file('keystore.properties')
            if (keystorePropsFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
        apply plugin: 'com.google.firebase.crashlytics'
        dependencies {
            implementation 'com.google.firebase:firebase-crashlytics:19.4.2'
        }
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services / Crashlytics plugins not applied. Push Notifications and Crashlytics won't work until you add android/app/google-services.json — see android-config/README.md")
}
