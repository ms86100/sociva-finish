name: Baseline Regression and E2E

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  schedule:
    # Nightly at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

env:
  BASE_URL: ${{ vars.E2E_BASE_URL || 'http://127.0.0.1:4173' }}
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

jobs:
  baseline:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    name: Lint, Unit, Build, Discovery
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Lint
        run: npx eslint . --quiet
      - name: Unit and component tests
        run: npm test
      - name: Production build
        run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Buyer discovery smoke (desktop and mobile)
        run: >-
          npx playwright test
          --config e2e/playwright.config.ts
          --grep @discovery-smoke
          --project=discovery-desktop
          --project=discovery-mobile
          --workers=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: discovery-smoke-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7

  e2e-full:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: Full E2E Suite (Nightly)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx playwright install --with-deps
      - name: Run full suite
        run: npx playwright test --config e2e/playwright.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 14
